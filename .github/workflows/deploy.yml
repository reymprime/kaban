# Kaban deploy — PRIVATE SOURCE setup
#
# How it works:
#   - This repo (kaban-src) is PRIVATE. Your Svelte source code stays hidden.
#   - On every push, this workflow builds the app and pushes ONLY the compiled
#     `dist` files (minified, unreadable) to the PUBLIC repo `kaban`.
#   - GitHub Pages serves the public repo, so the URL stays:
#     https://reymprime.github.io/kaban/
#
# One-time setup (see chat instructions):
#   1. Rename this repo to `kaban-src` and make it Private
#   2. Create a fresh PUBLIC repo named `kaban` (can be empty)
#   3. Create a fine-grained Personal Access Token with Contents: Read/Write
#      on the `kaban` repo, then add it here as a secret named DEPLOY_TOKEN
#   4. In the public `kaban` repo: Settings -> Pages -> Source: Deploy from a
#      branch -> Branch: gh-pages / (root)

name: Build & Deploy to public repo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Publish dist to public kaban repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: reymprime/kaban
          publish_branch: gh-pages
          publish_dir: ./dist
          commit_message: 'Deploy Kaban build'
